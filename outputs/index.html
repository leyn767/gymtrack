<button type="button" data-lang="ar" onclick="setLanguage('ar')">العربية</button></div>`}function showAuth(mode){let a=$('#auth');a.classList.add('open');a.innerHTML=`<div class="auth-card">${languageSwitch('auth-lang')}<div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg></span> GymTrack</div><div class="eyebrow">Your gentle strength ritual</div><h1>${mode==='login'?'Welcome back':'Create your account'}</h1><p>${mode==='login'?'Pick up where you left off.':'A little space for your movement and wellbeing.'}</p><form class="auth-form" id="authForm">${mode==='signup'?'<input class="field" name="name" placeholder="Your name" required maxlength="60">':''}<input class="field" name="email" type="email" placeholder="Email address" required autocomplete="email"><input class="field" name="password" type="password" placeholder="Password (at least 8 characters)" required minlength="8" autocomplete="${mode==='login'?'current-password':'new-password'}"><div class="error" id="authError"></div><button class="primary">${mode==='login'?'Log in':'Create account'}</button></form><div class="auth-switch">${mode==='login'?"New to GymTrack?":'Already have an account?'} <button class="link-btn" onclick="showAuth('${mode==='login'?'signup':'login'}')">${mode==='login'?'Sign up':'Log in'}</button></div><p style="font-size:10px;margin:18px 0 0">Your account is stored in this browser. Use a unique password.</p></div>`;$('#authForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.currentTarget),email=f.get('email').trim().toLowerCase(),pass=f.get('password'),err=$('#authError');if(mode==='signup'){if(state.users[email]){err.textContent=localized('An account with this email already exists.');return}state.users[email]={email,password:pass,profile:{name:f.get('name').trim(),goal:'Stay active',waterGoal:2500,onboarded:false},days:{},history:[],weights:[]};state.session=email;save();a.classList.remove('op
